name: Build Windows pilot
on:
  push:
    branches: [windows-pilot]
    paths: ['desktop/**', '.github/workflows/windows-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node --check main.cjs
          npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Waraqa-Windows-x64
          path: desktop/dist/Waraqa-Setup-x64.exe
          if-no-files-found: error
